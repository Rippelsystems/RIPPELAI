<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RippelAI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    margin: 0;
    background: #0f1115;
    color: #e8e8e8;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 16px 24px;
    background: #161922;
    border-bottom: 1px solid #2a2e3a;
    font-weight: 600;
    font-size: 18px;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg {
    max-width: 720px;
    padding: 12px 16px;
    border-radius: 10px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .user { align-self: flex-end; background: #2b5fb8; }
  .assistant { align-self: flex-start; background: #1e2230; }
  .quick-buttons {
    display: flex;
    gap: 8px;
    padding: 0 24px 12px;
    flex-wrap: wrap;
  }
  .quick-buttons button {
    background: #1e2230;
    color: #e8e8e8;
    border: 1px solid #2a2e3a;
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
  }
  .quick-buttons button:hover { background: #2a2e3a; }
  form {
    display: flex;
    padding: 16px 24px;
    gap: 12px;
    border-top: 1px solid #2a2e3a;
    background: #161922;
  }
  input[type=text] {
    flex: 1;
    padding: 12px 16px;
    border-radius: 8px;
    border: 1px solid #2a2e3a;
    background: #0f1115;
    color: #e8e8e8;
    font-size: 15px;
  }
  button[type=submit] {
    padding: 12px 24px;
    border-radius: 8px;
    border: none;
    background: #2b5fb8;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  .loading { opacity: 0.6; font-style: italic; }
</style>
</head>
<body>

<header>RippelAI — Rippel Effect Systems</header>

<div class="quick-buttons">
  <button onclick="quickAsk('What are our RLL stock shortages right now?')">RLL shortages</button>
  <button onclick="quickAsk('Can we build 400 RLL units? What is missing?')">Build 400 RLL?</button>
</div>

<div id="chat"></div>

<form id="chatForm">
  <input type="text" id="input" placeholder="Ask about stock, cashflow, or production..." autocomplete="off" />
  <button type="submit">Send</button>
</form>

<script>
  const chatEl = document.getElementById('chat');
  const form = document.getElementById('chatForm');
  const input = document.getElementById('input');

  let messages = [];

  function addBubble(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    chatEl.appendChild(div);
    chatEl.scrollTop = chatEl.scrollHeight;
    return div;
  }

  function quickAsk(text) {
    input.value = text;
    form.dispatchEvent(new Event('submit'));
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addBubble('user', text);
    messages.push({ role: 'user', content: text });
    input.value = '';

    const loadingBubble = addBubble('assistant', 'Thinking...');
    loadingBubble.classList.add('loading');

    try {
      const res = await fetch('/.netlify/functions/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages })
      });
      const data = await res.json();

      const textBlock = (data.content || []).find(b => b.type === 'text');
      const replyText = textBlock ? textBlock.text : 'No response received.';

      loadingBubble.textContent = replyText;
      loadingBubble.classList.remove('loading');

      messages.push({ role: 'assistant', content: data.content });

    } catch (err) {
      loadingBubble.textContent = 'Error: ' + err.message;
      loadingBubble.classList.remove('loading');
    }
  });
</script>

</body>
</html>
